<section class="container">
    <section class="text">
        <h3 class="heading">{{heading}}</h3>
        <p class="paragraph">{{paragraph}}</p>
    </section>
    <section class="image">
        <img src={{image}} alt={{imageAlt}}>
        <p class="image-subtitle">{{ imageSubtitle || imageAlt }}</p>
    </section>
</section>
