<h3>Contact Me</h3>

<form action="https://formsubmit.co/8316104087e5120982788e92fa1aa36c" method="POST">
    <div class="txt_field">
        <label>Full Name</label>
        <input type="text" name="name" id="name" required placeholder="Sarah Jones">
    </div>

    <div class="txt_field">
        <label>Email</label>
        <input type="text" name="email" id="email" required placeholder="hello@yourmail.com">
    </div>

    <div class="txt_field" id="message">
        <label>Message</label>
        <textarea name="message" id="message" required placeholder="Your message"></textarea>
    </div>
    <input type="hidden" name="_captcha" value="false">

    <app-big-button type="submit" text="Send Message"></app-big-button>
</form>
